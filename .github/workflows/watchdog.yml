name: Watchdog (stall/DLQ alerts)

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watchdog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Fetch instance health endpoints
        id: fetch
        env:
          PUBLIC_BASE_URL: https://clinaxis.org
        run: |
          set -euo pipefail

          mkdir -p /tmp/watchdog
          curl -sf --max-time 30 "$PUBLIC_BASE_URL/api/event-queue/stats" \
            > /tmp/watchdog/event-queue.json || true
          curl -sf --max-time 30 "$PUBLIC_BASE_URL/api/data-source-state" \
            > /tmp/watchdog/data-source.json || true
          curl -sf --max-time 30 "$PUBLIC_BASE_URL/api/scraper-progress" \
            > /tmp/watchdog/scraper-progress.json || true
          curl -sf --max-time 30 "$PUBLIC_BASE_URL/health" \
            > /tmp/watchdog/frontend-health.json || true

      - name: Evaluate thresholds
        id: evaluate
        env:
          WATCHDOG_DLQ_THRESHOLD: ${{ vars.WATCHDOG_DLQ_THRESHOLD || '10' }}
          WATCHDOG_STALE_HOURS: ${{ vars.WATCHDOG_STALE_HOURS || '6' }}
          WATCHDOG_STALL_HOURS: ${{ vars.WATCHDOG_STALL_HOURS || '6' }}
        run: |
          set -euo pipefail
          if bash scripts/health-check.sh \
            --event-queue /tmp/watchdog/event-queue.json \
            --data-source /tmp/watchdog/data-source.json \
            --scraper-progress /tmp/watchdog/scraper-progress.json \
            --frontend-health /tmp/watchdog/frontend-health.json \
            --alert-file /tmp/watchdog/alert.md; then
            echo "ALERT=0" >> "$GITHUB_ENV"
          else
            echo "ALERT=1" >> "$GITHUB_ENV"
          fi

      - name: Open alert issue
        if: env.ALERT == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          OPEN=$(gh issue list --label watchdog --state open --json number --jq 'length')
          if [ "$OPEN" -eq 0 ]; then
            gh label create watchdog --force 2>/dev/null || true
            gh issue create --title "Watchdog: pipeline stalled or DLQ over threshold" \
              --label watchdog --body-file /tmp/watchdog/alert.md
            echo "Alert issue created"
          else
            echo "Alert issue already open - quiet period active"
          fi

      - name: Close resolved alert issue
        if: env.ALERT == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          OPEN=$(gh issue list --label watchdog --state open --json number --jq '.[].number')
          if [ -n "$OPEN" ]; then
            for n in $OPEN; do
              gh issue close "$n" --comment "Watchdog: instance healthy again"
            done
            echo "Closed resolved alert issue(s)"
          else
            echo "No open alert issues"
          fi
