name: Build, Test & Deploy

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      reset_db:
        description: 'Reset the database before deploying (drops all data)'
        required: false
        default: false
        type: boolean

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: clinical_trial_data
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      POSTGRES_CONNECTION_STRING: >-
        Host=localhost;Port=5432;Database=clinical_trial_data;Username=postgres;Password=postgres;

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Unit Tests
        run: dotnet test Scrapers.Tests/Scrapers.Tests.csproj --no-build --logger trx

      - name: DB Integration Tests
        run: >-
          dotnet test Scrapers.IntegrationTests/Scrapers.IntegrationTests.csproj
          --no-build --filter "TestCategory!=HttpLive" --logger trx

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: '**/*.trx'

  deploy:
    needs: test
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Install dotnet-ef tool
        run: dotnet tool install --global dotnet-ef

      - name: Publish DataApi
        run: >-
          dotnet publish DataApi/ -c Release -r linux-x64
          --self-contained -o publish/dataapi

      - name: Publish Frontend
        run: >-
          dotnet publish Frontend/ -c Release -r linux-x64
          --self-contained -o publish/frontend

      - name: Publish IngestionApp
        run: >-
          dotnet publish IngestionApp/ -c Release -r linux-x64
          --self-contained -o publish/ingestion

      - name: Generate migration bundle
        run: |
          dotnet ef migrations bundle --project Scrapers/ --self-contained -r linux-x64 -o publish/efbundle
          chmod +x publish/efbundle

      - name: Deploy to Droplet
        run: bash deploy/deploy.sh --skip-build
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          PROD_DB_CONNECTION: ${{ secrets.PROD_DB_CONNECTION }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          RESET_DB: ${{ github.event.inputs.reset_db || 'false' }}
