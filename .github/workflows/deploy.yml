name: Build, Test & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: clinical_trial_data
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      POSTGRES_CONNECTION_STRING: Host=localhost;Port=5432;Database=clinical_trial_data;Username=postgres;Password=postgres;

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Unit Tests
        run: dotnet test Scrapers.Tests/Scrapers.Tests.csproj --no-build

      - name: DB Integration Tests
        run: dotnet test Scrapers.IntegrationTests/Scrapers.IntegrationTests.csproj --no-build --filter "TestCategory!=HttpLive"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/test-results.trx'

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Install dotnet-ef tool
        run: dotnet tool install --global dotnet-ef

      - name: Publish DataApi
        run: dotnet publish DataApi/ -c Release -r linux-x64 --self-contained -o publish/dataapi

      - name: Publish Frontend
        run: dotnet publish Frontend/ -c Release -r linux-x64 --self-contained -o publish/frontend

      - name: Publish IngestionApp
        run: dotnet publish IngestionApp/ -c Release -r linux-x64 --self-contained -o publish/ingestion

      - name: Generate migration bundle
        run: |
          dotnet ef migrations bundle --project Scrapers/ --self-contained -r linux-x64 -o publish/efbundle
          chmod +x publish/efbundle

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "SSH key created. Testing ssh-keyscan..."
          if ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts 2>&1; then
            echo "✓ Host key added to known_hosts"
            cat ~/.ssh/known_hosts
          else
            echo "✗ ssh-keyscan failed. Host may be unreachable."
            echo "Continuing anyway (will fail at connection test)..."
          fi

      - name: Test SSH connection
        run: |
          echo "Testing SSH connection to ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}..."
          if ssh -vvv -i ~/.ssh/deploy_key -o ConnectTimeout=10 \
              ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
              "echo '✓ SSH connection successful'" 2>&1; then
            echo "✓ Connection test passed"
          else
            echo "✗ Connection test failed - see verbose output above"
            echo ""
            echo "Diagnostic info:"
            echo "  - Key file readable: $(test -r ~/.ssh/deploy_key && echo 'YES' || echo 'NO')"
            if [ -f ~/.ssh/deploy_key ]; then
              echo "  - Key file exists: YES"
            else
              echo "  - Key file exists: NO"
            fi
            echo "  - known_hosts contents:"
            cat ~/.ssh/known_hosts 2>/dev/null || echo "    (empty or missing)"
            exit 1
          fi

      - name: Stop services and release ports
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} <<'EOSSH'
          sudo systemctl stop clinicaltrialdata-api clinicaltrialdata-frontend clinicaltrialdata-ingestion 2>/dev/null || true
          for i in {1..15}; do
            api_up=$(lsof -i :5003 2>/dev/null || true)
            frontend_up=$(lsof -i :5001 2>/dev/null || true)
            if [ -z "$api_up" ] && [ -z "$frontend_up" ]; then
              echo "All ports released after ${i}s"
              break
            fi
            sleep 1
          done
          EOSSH

      - name: Save current as rollback target
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "sudo mkdir -p /opt/clinicaltrialdata && for dir in api frontend ingestion; do mv /opt/clinicaltrialdata/\$dir /opt/clinicaltrialdata/\$dir.previous 2>/dev/null || true; done"

      - name: Copy binaries to Droplet
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "sudo mkdir -p /opt/clinicaltrialdata/{api,frontend,ingestion} && \
             sudo chown -R ct-deploy:ct-deploy /opt/clinicaltrialdata"
          scp -r -i ~/.ssh/deploy_key "$PWD/publish/dataapi"/* ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/clinicaltrialdata/api/
          scp -r -i ~/.ssh/deploy_key "$PWD/publish/frontend"/* ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/clinicaltrialdata/frontend/
          scp -r -i ~/.ssh/deploy_key "$PWD/publish/ingestion"/* ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/clinicaltrialdata/ingestion/
          scp -i ~/.ssh/deploy_key "$PWD/publish/efbundle" ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/clinicaltrialdata/efbundle
          scp -i ~/.ssh/deploy_key "$PWD/scripts/smoke-test-deploy.sh" ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/clinicaltrialdata/smoke-test-deploy.sh
          scp -i ~/.ssh/deploy_key deploy/systemd/clinicaltrialdata-api.service ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/clinicaltrialdata/
          scp -i ~/.ssh/deploy_key deploy/systemd/clinicaltrialdata-frontend.service ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/clinicaltrialdata/
          scp -i ~/.ssh/deploy_key deploy/systemd/clinicaltrialdata-ingestion.service ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/clinicaltrialdata/

      - name: Update environment and install systemd units
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} <<'EOSSH'
          cat <<'EOF' | sudo tee /etc/clinicaltrialdata.env > /dev/null 2>&1
          POSTGRES_CONNECTION_STRING=${{ secrets.PROD_DB_CONNECTION }}
          INGESTION_STUDY_LIMIT=0
          ASPNETCORE_ENVIRONMENT=Production
          EOF
          sudo cp /opt/clinicaltrialdata/clinicaltrialdata-api.service /etc/systemd/system/clinicaltrialdata-api.service
          sudo cp /opt/clinicaltrialdata/clinicaltrialdata-frontend.service /etc/systemd/system/clinicaltrialdata-frontend.service
          sudo cp /opt/clinicaltrialdata/clinicaltrialdata-ingestion.service /etc/systemd/system/clinicaltrialdata-ingestion.service
          sudo systemctl daemon-reload
          EOSSH

      - name: Apply database migrations
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} <<'EOSSH'
          echo "Applying pending database migrations..."
          chmod +x /opt/clinicaltrialdata/efbundle
          cs=$(grep POSTGRES_CONNECTION_STRING /etc/clinicaltrialdata.env | cut -d= -f2-)
          /opt/clinicaltrialdata/efbundle --connection "$cs"
          echo "Migrations applied successfully."
          EOSSH

      - name: Start DataApi first
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} <<'EOSSH'
          sudo systemctl start clinicaltrialdata-api
          echo "Waiting for DataApi health check..."
          for i in {1..30}; do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5003/health 2>/dev/null || echo "000")
            if [ "$code" = "200" ]; then
              echo "DataApi healthy after ${i}s"
              break
            fi
            if [ "$i" = "30" ]; then
              echo "DataApi failed to start"
              sudo journalctl -u clinicaltrialdata-api --no-pager -n 30
              exit 1
            fi
            sleep 2
          done
          # Warm-up: trigger EF Core model compilation before frontend/ingestion start
          for endpoint in /api/investigators?page=1\&pageSize=1 /api/stats; do
            curl -s -o /dev/null --max-time 60 "http://localhost:5003$endpoint" 2>/dev/null || true
          done
          EOSSH

      - name: Start remaining services
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} <<'EOSSH'
          sudo systemctl start clinicaltrialdata-frontend clinicaltrialdata-ingestion
          EOSSH

      - name: Health check
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} <<'EOSSH'
          echo "Checking service health..."
          echo "--- Service status ---"
          for svc in clinicaltrialdata-api clinicaltrialdata-frontend clinicaltrialdata-ingestion; do
            status=$(systemctl is-active "$svc" 2>/dev/null || echo "not-found")
            echo "  $svc: $status"
          done
          echo "--- Health check ---"
          for i in {1..20}; do
            api_code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5003/health 2>/dev/null || echo "000")
            frontend_code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5001/health 2>/dev/null || echo "000")
            echo "Attempt $i/20: DataApi=$api_code Frontend=$frontend_code"
            if [ "$api_code" = "200" ] && [ "$frontend_code" = "200" ]; then
              echo "Health check passed - All services healthy"
              exit 0
            fi
            sleep 2
          done
          echo "Health check failed - dumping service logs"
          echo "--- DataApi journal ---"
          sudo journalctl -u clinicaltrialdata-api --no-pager -n 20 2>/dev/null || true
          echo "--- Frontend journal ---"
          sudo journalctl -u clinicaltrialdata-frontend --no-pager -n 20 2>/dev/null || true
          exit 1
          EOSSH

      - name: Business endpoint smoke tests
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} <<'EOSSH'
          chmod +x /opt/clinicaltrialdata/smoke-test-deploy.sh
          for i in {1..3}; do
            echo "Smoke test attempt $i/3..."
            if bash /opt/clinicaltrialdata/smoke-test-deploy.sh http://localhost:5003; then
              echo "Smoke tests passed"
              exit 0
            fi
            echo "Smoke tests failed, retrying in 5s..."
            sleep 5
          done
          exit 1
          EOSSH

      - name: Cleanup rollback
        if: success()
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "for dir in api frontend ingestion; do rm -rf /opt/clinicaltrialdata/\$dir.previous 2>/dev/null || true; done"

      - name: Rollback on failure
        if: failure()
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} <<'EOSSH'
          echo "Rolling back to previous deployment..."
          sudo systemctl stop clinicaltrialdata-api clinicaltrialdata-frontend clinicaltrialdata-ingestion 2>/dev/null || true
          for dir in api frontend ingestion; do
            [ -d "/opt/clinicaltrialdata/$dir.previous" ] && mv "/opt/clinicaltrialdata/$dir.previous" "/opt/clinicaltrialdata/$dir"
          done
          sudo systemctl start clinicaltrialdata-api clinicaltrialdata-frontend clinicaltrialdata-ingestion
          EOSSH
