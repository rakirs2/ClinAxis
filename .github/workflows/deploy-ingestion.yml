name: Deploy IngestionApp

on:
  push:
    branches:
      - main
    paths:
      - 'IngestionApp/**'
      - 'Scrapers/**'
      - '.github/workflows/deploy-ingestion.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore IngestionApp/IngestionApp.csproj

      - name: Build
        run: dotnet build IngestionApp/IngestionApp.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish IngestionApp/IngestionApp.csproj --configuration Release --self-contained -r linux-x64 -o ./publish-ingestion

      - name: Deploy to DigitalOcean
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H $DEPLOY_HOST >> ~/.ssh/known_hosts 2>/dev/null || true
          
          # Graceful shutdown of the service (systemd handles SIGTERM)
          ssh -i ~/.ssh/id_rsa $DEPLOY_USER@$DEPLOY_HOST "sudo systemctl stop clinicaltrialdata-ingestion" || true
          
          # Wait for graceful shutdown to complete
          sleep 10
          
          # Deploy new binaries
          scp -r -i ~/.ssh/id_rsa ./publish-ingestion/* $DEPLOY_USER@$DEPLOY_HOST:/opt/clinicaltrialdata/ingestion/
          
          # Start the service
          ssh -i ~/.ssh/id_rsa $DEPLOY_USER@$DEPLOY_HOST "sudo systemctl start clinicaltrialdata-ingestion"
          
          # Verify service started (no health check endpoint for background service)
          echo "IngestionApp deployment completed. Service will begin processing in background."

      - name: Cleanup
        if: always()
        run: |
          rm -f ~/.ssh/id_rsa
