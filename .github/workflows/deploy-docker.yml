name: Deploy (Docker)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (default: latest)'
        required: false
        default: 'latest'
      reset_db:
        description: 'Reset database before deploy (drops and recreates schema)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_API: rakirs2/clinicaltrialdata-api
  IMAGE_FRONTEND: rakirs2/clinicaltrialdata-frontend
  IMAGE_INGESTION: rakirs2/clinicaltrialdata-ingestion
  PUBLIC_DOMAIN: clinaxis.org

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false

      - name: Restore Git LFS cache
        id: lfs-cache
        uses: actions/cache/restore@v6
        with:
          path: .git/lfs/objects
          key: lfs-${{ runner.os }}-${{ hashFiles('.gitattributes', '**/*onnx*', '**/*.bin') }}
          restore-keys: |
            lfs-${{ runner.os }}-

      - name: Fetch Git LFS assets
        run: git lfs pull && git lfs checkout

      - name: Save Git LFS cache
        if: github.ref == 'refs/heads/main' && steps.lfs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .git/lfs/objects
          key: lfs-${{ runner.os }}-${{ hashFiles('.gitattributes', '**/*onnx*', '**/*.bin') }}

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push DataApi
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.api
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_API }}:${{ inputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Frontend
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.frontend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_FRONTEND }}:${{ inputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push IngestionApp
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.ingestion
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_INGESTION }}:${{ inputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Push docker-compose.yml and deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          PROD_DB_CONNECTION: ${{ secrets.PROD_DB_CONNECTION }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail

          SSH_KEY_FILE=$(mktemp)
          echo "$DEPLOY_SSH_KEY" > "$SSH_KEY_FILE"
          chmod 600 "$SSH_KEY_FILE"

          remote() {
            for i in $(seq 1 3); do
              ssh -i "$SSH_KEY_FILE" -o ConnectTimeout=15 -o ServerAliveInterval=15 \
                -o ServerAliveCountMax=3 -o StrictHostKeyChecking=no \
                "$DEPLOY_USER@$DEPLOY_HOST" "$@" && return 0
              echo "SSH failed (attempt $i/3), retrying in 5s..." >&2
              sleep 5
            done
            return 1
          }
          copy() { scp -i "$SSH_KEY_FILE" "$@"; }

          R="/opt/clinicaltrialdata"

          echo "--- Create deploy dir ---"
          remote "mkdir -p $R"

          echo "--- Verify PostgreSQL cluster ---"
          remote "sudo systemctl start postgresql@16-main.service 2>/dev/null || true
            for i in \$(seq 1 15); do
              if pg_isready -h 127.0.0.1 -p 5432 -t 3 >/dev/null 2>&1; then
                echo 'PostgreSQL 16/main is accepting connections'
                exit 0
              fi
              sleep 2
            done
            echo 'FATAL: PostgreSQL 16/main is not accepting connections' >&2
            sudo systemctl status postgresql@16-main.service --no-pager || true
            sudo systemctl status postgresql.service --no-pager || true
            sudo pg_lsclusters || true
            sudo ss -ltnp | grep ':5432' || true
            exit 1"

          echo "--- Stop and remove any leftover containers ---"
          remote "cd $R && sudo docker compose --env-file $R/.env down --remove-orphans 2>/dev/null || true"
          remote "sudo docker rm -f \$(sudo docker ps -aq) 2>/dev/null || true"

          echo "--- Ensure Docker is installed and running ---"
          remote "sudo docker version >/dev/null 2>&1 || curl -fsSL https://get.docker.com | sudo sh"
          remote "sudo systemctl reset-failed docker.service 2>/dev/null; \
            sudo systemctl enable docker.service && \
            sudo systemctl restart docker.service"
          remote "for i in \$(seq 1 20); do \
            test -S /var/run/docker.sock && sudo docker info >/dev/null 2>&1 && break; \
            sleep 2; done"

          echo "--- Install docker compose plugin if needed ---"
          remote "sudo docker compose version 2>/dev/null || (
            sudo mkdir -p /usr/local/lib/docker/cli-plugins;
            os=\$(uname -s | tr A-Z a-z); arch=\$(uname -m);
            sudo curl -sSL \
              \"https://github.com/docker/compose/releases/latest/download/docker-compose-\$os-\$arch\" \
              -o /usr/local/lib/docker/cli-plugins/docker-compose;
            sudo chmod +x /usr/local/lib/docker/cli-plugins/docker-compose;
          )"

          echo "--- Copy docker-compose.yml (with production image tags) ---"
          sed "s|:latest|:${{ inputs.tag }}|g" docker-compose.yml > /tmp/docker-compose.prod.yml
          copy /tmp/docker-compose.prod.yml "$DEPLOY_USER@$DEPLOY_HOST:$R/docker-compose.yml"
          copy Caddyfile "$DEPLOY_USER@$DEPLOY_HOST:$R/Caddyfile"

          echo "--- Write .env file ---"
          printf "POSTGRES_CONNECTION_STRING=%s\nINGESTION_STUDY_LIMIT=0\n" \
            "$PROD_DB_CONNECTION" > /tmp/docker-compose.env
          copy /tmp/docker-compose.env "$DEPLOY_USER@$DEPLOY_HOST:$R/.env"

          echo "--- Pull images ---"
          remote "echo '${{ secrets.GITHUB_TOKEN }}' | sudo docker login ${{ env.REGISTRY }} \
            -u ${{ github.actor }} --password-stdin"
          remote "cd $R && sudo docker compose --env-file $R/.env pull"

          echo "--- Stop systemd services ---"
          remote "for svc in clinicaltrialdata-api clinicaltrialdata-frontend \
            clinicaltrialdata-ingestion; do \
              sudo systemctl stop \"\$svc\" 2>/dev/null || true; \
              sudo systemctl disable \"\$svc\" 2>/dev/null || true; \
            done"

          if [ "${{ inputs.reset_db }}" = "true" ]; then
            echo "--- Resetting database ---"
            remote "sudo docker run --rm --network host \
              -e POSTGRES_CONNECTION_STRING='$PROD_DB_CONNECTION' \
              ${{ env.REGISTRY }}/${{ env.IMAGE_API }}:${{ inputs.tag }} \
              /app/DataApi --reset-db"
          fi

          echo "--- Start Docker containers ---"
          remote "cd $R && sudo docker compose --env-file $R/.env up -d --wait --wait-timeout 60 || {
            echo '--- DataApi container logs ---' >&2
            sudo docker logs --tail 300 clinicaltrialdata-api 2>&1 || true
            echo '--- DataApi health state ---' >&2
            sudo docker inspect --format '{{json .State.Health}}' clinicaltrialdata-api 2>&1 || true
            echo '--- Docker Compose status ---' >&2
            sudo docker compose --env-file $R/.env ps 2>&1 || true
            exit 1
          }"

          echo "--- Internal health checks ---"
          remote "for port in 5003 5001; do
            for i in \$(seq 1 10); do
              code=\$(curl -s -o /dev/null -w '%{http_code}' \
                --max-time 30 http://localhost:\$port/health 2>/dev/null || echo '000')
              if [ \"\$code\" = \"200\" ]; then
                echo \"Internal port \$port healthy\"; break
              fi
              if [ \"\$i\" = \"10\" ]; then
                echo \"FATAL: internal port \$port health check failed\"; exit 1
              fi
              sleep 3
            done
          done"

          echo "--- Public HTTPS health checks ---"
          for host in "$PUBLIC_DOMAIN" "www.$PUBLIC_DOMAIN"; do
            for i in $(seq 1 20); do
              if curl -fsS --max-time 30 "https://$host/health" >/dev/null; then
                echo "Public HTTPS healthy: $host"
                break
              fi
              if [ "$i" = "20" ]; then
                echo "FATAL: public HTTPS health check failed: $host"
                exit 1
              fi
              sleep 3
            done
          done
          curl -fsS --max-time 30 "https://$PUBLIC_DOMAIN/api/data-source-state" >/dev/null
          echo "Public DataApi routing healthy: $PUBLIC_DOMAIN/api/data-source-state"

          echo "--- Validate pipeline scrape ---"
          # The ingestion loop may legitimately remain syncing while it drains a
          # previously claimed event. Reject stale idle/failed states, but do not
          # fail a healthy deployment solely because that recovery window is active.
          sleep 120
          remote 'curl -sf --max-time 30 http://localhost:5003/api/data-source-state' \
            > /tmp/data-source-state.json
          python3 - <<'EOF'
          import json, datetime

          now = datetime.datetime.now(datetime.timezone.utc)
          for s in json.load(open("/tmp/data-source-state.json")):
              if s.get("sourceName") != "ClinicalTrials.gov":
                  continue
              status = s.get("status")
              updated = s.get("updatedAt")
              recent_healthy_state = False
              if updated:
                  updated_dt = datetime.datetime.fromisoformat(updated.replace("Z", "+00:00"))
                  updated_age_min = (now - updated_dt).total_seconds() / 60
                  recent_healthy_state = (
                      status in {"idle", "syncing"}
                      and not s.get("errorMessage")
                      and updated_age_min <= 30
                  )
              ts = s.get("lastSyncTimestamp")
              if not ts:
                  if recent_healthy_state:
                      print(
                          f"Pipeline state is healthy and recent ({status}); "
                          "lastSyncTimestamp is not set yet")
                      continue
                  raise SystemExit("FATAL: ClinicalTrials.gov has no lastSyncTimestamp after deploy")
              dt = datetime.datetime.fromisoformat(ts.replace("Z", "+00:00"))
              age_min = (now - dt).total_seconds() / 60
              if age_min > 30:
                  if recent_healthy_state:
                      print(
                          f"Pipeline state is healthy and recent ({status}); "
                          f"retaining lastSyncTimestamp {ts} at {age_min:.0f}m old")
                      continue
                  raise SystemExit(
                      f"FATAL: lastSyncTimestamp {ts} is {age_min:.0f}m old (>30m) after deploy")
              print(f"Pipeline scrape OK: lastSyncTimestamp {ts} is {age_min:.0f}m old")
          EOF

          echo "--- Cleanup old images ---"
          remote "sudo docker image prune -f 2>/dev/null || true"

          echo "=== Docker deploy complete (tag: ${{ inputs.tag }}) ==="
