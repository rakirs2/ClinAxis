name: Deploy DataApi

on:
  push:
    branches:
      - main
    paths:
      - 'DataApi/**'
      - '.github/workflows/deploy-dataapi.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore DataApi/DataApi.csproj

      - name: Build
        run: dotnet build DataApi/DataApi.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish DataApi/DataApi.csproj --configuration Release --self-contained -r linux-x64 -o ./publish-dataapi

      - name: Deploy to DigitalOcean
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H $DEPLOY_HOST >> ~/.ssh/known_hosts 2>/dev/null || true
          
          # Stop the service
          ssh -i ~/.ssh/id_rsa $DEPLOY_USER@$DEPLOY_HOST "sudo systemctl stop clinicaltrialdata-api" || true
          
          # Deploy new binaries
          scp -r -i ~/.ssh/id_rsa ./publish-dataapi/* $DEPLOY_USER@$DEPLOY_HOST:/opt/clinicaltrialdata/api/
          
          # Start the service
          ssh -i ~/.ssh/id_rsa $DEPLOY_USER@$DEPLOY_HOST "sudo systemctl start clinicaltrialdata-api"
          
          # Health check
          for i in {1..10}; do
            if ssh -i ~/.ssh/id_rsa $DEPLOY_USER@$DEPLOY_HOST "curl -s http://localhost:5003/health | grep -q healthy"; then
              echo "DataApi is healthy"
              exit 0
            fi
            echo "Attempt $i: Waiting for DataApi to be ready..."
            sleep 5
          done
          
          echo "DataApi failed to become healthy"
          exit 1

      - name: Cleanup
        if: always()
        run: |
          rm -f ~/.ssh/id_rsa
