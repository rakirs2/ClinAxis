name: .NET CI

on:
  push:
    branches: [ "main", "feature/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  unit-and-db-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: clinical_trial_data
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      POSTGRES_CONNECTION_STRING: Host=localhost;Port=5432;Database=clinical_trial_data;Username=postgres;Password=postgres;
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore
        # Note: CA* code analysis rules from .editorconfig are enforced locally but not in CI.

      - name: Unit Tests
        run: dotnet test Scrapers.Tests/Scrapers.Tests.csproj --no-build

      - name: DB Integration Tests
        run: dotnet test Scrapers.IntegrationTests/Scrapers.IntegrationTests.csproj --no-build --filter "TestCategory!=HttpLive"

  live-http-tests:
    needs: unit-and-db-tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: clinical_trial_data
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      POSTGRES_CONNECTION_STRING: Host=localhost;Port=5432;Database=clinical_trial_data;Username=postgres;Password=postgres;
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore
        # Note: CA* code analysis rules from .editorconfig are enforced locally but not in CI.

      - name: Start services (background)
        run: |
          nohup dotnet run --project DataApi/DataApi.csproj --no-build > /tmp/dataapi.log 2>&1 &
          echo "DataApi PID: $!"
          nohup dotnet run --project Frontend/Frontend.csproj --no-build > /tmp/frontend.log 2>&1 &
          echo "Frontend PID: $!"

      - name: Wait for services
        shell: bash
        run: |
          set +e
          for i in $(seq 1 15); do
            api_code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5003/api/studies?page=1\&pageSize=1 2>/dev/null)
            frontend_code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5001/ 2>/dev/null)
            echo "[$((i*2))s] DataApi=$api_code Frontend=$frontend_code"
            if [ -n "$api_code" ] && [ "$api_code" != "000" ] && [ -n "$frontend_code" ] && [ "$frontend_code" != "000" ]; then
              echo "Both services ready (returning $api_code / $frontend_code)"
              exit 0
            fi
            sleep 2
          done
          echo "--- DataApi log ---"
          head -20 /tmp/dataapi.log
          echo "--- Frontend log ---"
          head -20 /tmp/frontend.log
          echo "Services failed to start"
          exit 1

      - name: Live HTTP Tests
        run: dotnet test Scrapers.IntegrationTests/Scrapers.IntegrationTests.csproj --no-build --filter "TestCategory=HttpLive"
