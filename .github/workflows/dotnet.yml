name: .NET CI

on:
  pull_request:
    branches: [ "main" ]

jobs:
  unit-and-db-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: clinical_trial_data
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      POSTGRES_CONNECTION_STRING: >-
        Host=localhost;Port=5432;Database=clinical_trial_data;Username=postgres;Password=postgres;
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore
        # Note: CA* code analysis rules from .editorconfig are enforced locally but not in CI.

      - name: Unit Tests
        run: dotnet test Scrapers.Tests/Scrapers.Tests.csproj --no-build

      - name: DataApi Unit Tests
        run: dotnet test DataApi.Tests/DataApi.Tests.csproj --no-build

      - name: DB Integration Tests
        run: dotnet test Scrapers.IntegrationTests/Scrapers.IntegrationTests.csproj --no-build

      - name: Frontend Tests
        # Runs after the Docker-heavy integration suite to avoid concurrent
        # machine load; bUnit page tests flake under thread-pool starvation.
        run: dotnet test Frontend.Tests/Frontend.Tests.csproj --no-build

      - name: Watchdog Script Tests
        # Offline bash unit tests for scripts/health-check.sh (no Docker, no network).
        run: bash scripts/test-health-check.sh
