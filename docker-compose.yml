services:
  data-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: ghcr.io/rakirs2/clinicaltrialdata-api:latest
    container_name: clinicaltrialdata-api
    restart: unless-stopped
    network_mode: host
    mem_limit: 256m
    environment:
      - POSTGRES_CONNECTION_STRING=${POSTGRES_CONNECTION_STRING}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:5003/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: ghcr.io/rakirs2/clinicaltrialdata-frontend:latest
    container_name: clinicaltrialdata-frontend
    restart: unless-stopped
    network_mode: host
    mem_limit: 192m
    environment:
      - DataApi__BaseUrl=http://localhost:5003
    depends_on:
      data-api:
        condition: service_started

  ingestion:
    build:
      context: .
      dockerfile: Dockerfile.ingestion
    image: ghcr.io/rakirs2/clinicaltrialdata-ingestion:latest
    container_name: clinicaltrialdata-ingestion
    restart: unless-stopped
    network_mode: host
    mem_limit: 768m
    environment:
      - POSTGRES_CONNECTION_STRING=${POSTGRES_CONNECTION_STRING}
      - INGESTION_STUDY_LIMIT=${INGESTION_STUDY_LIMIT:-0}
    depends_on:
      data-api:
        condition: service_started