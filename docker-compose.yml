services:
  postgres:
    image: postgres:16
    container_name: clinical-trial-data-db
    profiles: ["dev", "full"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: clinical_trial_data
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  data-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: ghcr.io/rakirs2/clinicaltrialdata-api:latest
    container_name: clinicaltrialdata-api
    restart: unless-stopped
    ports:
      - "5003:5003"
    environment:
      - POSTGRES_CONNECTION_STRING=${POSTGRES_CONNECTION_STRING:-Host=postgres;Port=5432;Database=clinical_trial_data;Username=postgres;Password=postgres}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:5003/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: ghcr.io/rakirs2/clinicaltrialdata-frontend:latest
    container_name: clinicaltrialdata-frontend
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      - DataApi__BaseUrl=http://data-api:5003
    depends_on:
      data-api:
        condition: service_healthy

  ingestion:
    build:
      context: .
      dockerfile: Dockerfile.ingestion
    image: ghcr.io/rakirs2/clinicaltrialdata-ingestion:latest
    container_name: clinicaltrialdata-ingestion
    restart: unless-stopped
    environment:
      - POSTGRES_CONNECTION_STRING=${POSTGRES_CONNECTION_STRING:-Host=postgres;Port=5432;Database=clinical_trial_data;Username=postgres;Password=postgres}
      - INGESTION_STUDY_LIMIT=${INGESTION_STUDY_LIMIT:-0}
    depends_on:
      data-api:
        condition: service_started

volumes:
  pgdata: